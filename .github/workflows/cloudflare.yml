name: Validate and deploy LITRIC to Cloudflare
on:
  pull_request:
    branches: [main, feat/litric-v2-standalone]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: litric-cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run check:public
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - run: node scripts/check-pages.mjs --worker
      - run: npm run build:api
      - run: npm run test:api
      - name: Verify SMARTLIB Agent browser behavior and accessibility
        run: npm run test:agent:browser
        env:
          LITRIC_QA_ARTIFACTS: ${{ runner.temp }}/litric-agent-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litric-agent-browser-validation
          path: ${{ runner.temp }}/litric-agent-browser/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: litric-worker-validation
          path: dist-worker/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.LITRIC_CLOUDFLARE_READY == 'true'
    needs: validate
    environment: cloudflare-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ vars.CLOUDFLARE_D1_ID }}
      LITRIC_WORKER_NAME: ${{ vars.LITRIC_WORKER_NAME }}
      LITRIC_PRODUCTION_URL: ${{ vars.LITRIC_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run configure:cloudflare
      - run: npm run build:cloudflare
      - name: Apply migrations only to the configured school database
        run: npx wrangler d1 migrations apply litric-school --remote --config standalone/wrangler.generated.jsonc
      - run: npm run deploy:cloudflare
      - name: Verify live frontend and protected API
        run: node scripts/verify-cloudflare.mjs
