name: Legacy Pages build only (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-legacy-static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run build:pages
      - run: npm run check:standalone
